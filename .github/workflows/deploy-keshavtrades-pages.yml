name: Deploy KeshavTrades to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Personal_projects/Trading-Journal/public/**"
      - ".github/workflows/deploy-keshavtrades-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: keshavtrades-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload KeshavTrades static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Personal_projects/Trading-Journal/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
